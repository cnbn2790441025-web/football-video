name: Render Video
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci || npm install
      - run: sudo apt-get update && sudo apt-get install -y libgbm-dev ffmpeg
      - run: npx remotion render MatchPreview out/highlight_60s.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: Football-Highlight-Video
          path: out/highlight_60s.mp4
