name: Render Video

on:
  workflow_dispatch:
    inputs:
      match_date:
        description: "Match date (YYYY-MM-DD)"
        required: true
        default: "2026-10-25"
        type: string
      home_team:
        description: "Home team name"
        required: true
        default: "Liverpool"
        type: string
      away_team:
        description: "Away team name"
        required: true
        default: "Brighton & Hove Albion"
        type: string

jobs:
  render_liverpool_brighton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Match Data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          MATCH_DATE: ${{ inputs.match_date }}
          HOME_TEAM: ${{ inputs.home_team }}
          AWAY_TEAM: ${{ inputs.away_team }}
        run: node scripts/fetch-match.js

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - name: Render Liverpool vs Brighton
        run: npx remotion render LiverpoolBrighton out/liverpool_brighton_60s.mp4 --gl=swangle

      - uses: actions/upload-artifact@v4
        with:
          name: Liverpool-Brighton-Preview
          path: out/liverpool_brighton_60s.mp4
