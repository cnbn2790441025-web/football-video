name: Render Cutback Attack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-cutback-attack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - name: Render Cutback Attack
        run: npx remotion render CutbackAttack out/cutback-attack.mp4 --gl=swangle

      - name: Upload Cutback Attack
        uses: actions/upload-artifact@v4
        with:
          name: cutback-attack
          path: out/cutback-attack.mp4
          if-no-files-found: error
          retention-days: 14
