name: Myanmar CTC Viterbi Alignment Test

on:
  workflow_dispatch:
    inputs:
      match_key:
        description: "Match asset key (without .mp3 or .srt)"
        required: true
        default: "arsenal-hull-city"
        type: string

permissions:
  contents: read

jobs:
  ctc-viterbi-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            numpy==1.26.4 \
            safetensors==0.7.0 \
            huggingface_hub==0.36.0

      - name: Run CTC Viterbi experiment
        env:
          MATCH_KEY: ${{ inputs.match_key }}
        run: |
          python scripts/test-myanmar-ctc-alignment.py "$MATCH_KEY"

      - name: Upload alignment results
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-ctc-viterbi-${{ inputs.match_key }}
          path: ctc-viterbi-test-output/
          if-no-files-found: error
          retention-days: 7
