name: Render Old Trafford Blue Red

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-stadium-light:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - name: Render Old Trafford Blue Red
        run: npx remotion render PosterLightMotionV1 out/stadium-light-blue-red.mp4 --gl=swangle

      - name: Upload Old Trafford Blue Red
        uses: actions/upload-artifact@v4
        with:
          name: old-trafford-blue-red
          path: out/stadium-light-blue-red.mp4
          if-no-files-found: error
          retention-days: 14
