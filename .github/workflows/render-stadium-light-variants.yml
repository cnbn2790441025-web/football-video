name: Render Stadium Light Color Variants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-stadium-light-variants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - name: Render original Blue Red
        run: npx remotion render PosterLightMotionV1 out/stadium-light-blue-red.mp4 --gl=swangle

      - name: Render Purple Cyan
        run: npx remotion render PosterLightMotionPurpleCyan out/stadium-light-purple-cyan.mp4 --gl=swangle

      - name: Render Gold White
        run: npx remotion render PosterLightMotionGoldWhite out/stadium-light-gold-white.mp4 --gl=swangle

      - name: Render Green Amber
        run: npx remotion render PosterLightMotionGreenAmber out/stadium-light-green-amber.mp4 --gl=swangle

      - name: Upload Stadium Light clips
        uses: actions/upload-artifact@v4
        with:
          name: stadium-light-color-variants
          path: out/stadium-light-*.mp4
          if-no-files-found: error
          retention-days: 14
