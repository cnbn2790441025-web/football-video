name: Myanmar CTC Mixed Alignment Test

on:
  workflow_dispatch:
    inputs:
      match_key:
        description: "Match asset key"
        required: true
        default: "arsenal-hull-city"
        type: string

permissions:
  contents: read

jobs:
  mixed-ctc-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            numpy==1.26.4 \
            safetensors==0.7.0 \
            huggingface_hub==0.36.0

      - name: Run Mixed CTC experiment
        env:
          MATCH_KEY: ${{ inputs.match_key }}
        run: |
          python scripts/test-myanmar-ctc-mixed.py "$MATCH_KEY"

      - name: Render 15-second preview
        run: |
          mkdir -p experiments/myanmar-ctc-mixed/output
          npx remotion render experiments/myanmar-ctc-mixed/preview-entry.tsx MyanmarCtcPreview experiments/myanmar-ctc-mixed/output/preview-15s.mp4 --codec=h264

      - name: Upload mixed alignment results
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-ctc-mixed-${{ inputs.match_key }}
          path: |
            ctc-mixed-test-output/
            experiments/myanmar-ctc-mixed/output/preview-15s.mp4
          if-no-files-found: error
          retention-days: 7