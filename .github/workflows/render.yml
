name: Render Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Install System Dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev ffmpeg

      - name: Render Remotion Video
        run: |
          npx remotion render MatchPreview out/highlight_60s.mp4 --gl=swangle

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Football-Highlight-Video
          path: out/highlight_60s.mp4
